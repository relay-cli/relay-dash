name: Bug report
description: Report reproducible Relay Dash behavior.
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the configuration, the service or pack-sentinel response, and the key sequence that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Relay Dash version, Node.js version, terminal, and operating system.
    validations:
      required: true
